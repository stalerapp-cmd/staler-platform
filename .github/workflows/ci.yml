name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apis:
    name: APIs — build & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/bank-api/package-lock.json
            apps/staler-api/package-lock.json
      - name: Install
        run: |
          (cd apps/bank-api && npm ci)
          (cd apps/staler-api && npm ci)
      - name: Typecheck & build
        run: |
          (cd apps/bank-api && npm run build)
          (cd apps/staler-api && npm run build)
      - name: TalerBank tests (legacy-schema upgrade, auth, ledger, link, wire gateway)
        working-directory: apps/bank-api
        run: npm test
      - name: S-Taler end-to-end tests (spawns a real TalerBank)
        working-directory: apps/staler-api
        run: npm test

  webs:
    name: Web apps — typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [staler-web, bank-web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [bank-api, staler-api, bank-web, staler-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (production dependencies)
        working-directory: apps/${{ matrix.app }}
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
