name: Android APKs

# Every push to main builds both APKs (download them from the run's "Artifacts").
# Pushing a tag like v1.2.0 also publishes them on the Releases page.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: S-Taler
            dir: apps/staler-web
            scheme: taler
            slug: s-taler
            api_var: STALER_API_URL
            default_api: https://s-taler.onrender.com
          - name: TalerBank
            dir: apps/bank-web
            scheme: talerbank
            slug: talerbank
            api_var: BANK_API_URL
            default_api: https://talerbank.onrender.com
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Resolve API address
        env:
          API_URL: ${{ vars[matrix.api_var] }}
          DEFAULT_API: ${{ matrix.default_api }}
        run: |
          url="${API_URL:-$DEFAULT_API}"
          if [ -z "$API_URL" ]; then
            echo "::warning::Repository variable ${{ matrix.api_var }} is not set — using $DEFAULT_API. Set it under Settings → Secrets and variables → Actions → Variables."
          fi
          case "$url" in https://*) ;; *) echo "::error::${{ matrix.api_var }} must start with https://"; exit 1 ;; esac
          echo "VITE_API_URL=${url%/}" >> "$GITHUB_ENV"

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web bundle (native mode, with its own CSP)
        run: npm run build:native

      - name: Create and harden the Android project
        run: |
          npx cap add android
          node ../../scripts/android/prepare.mjs . ${{ matrix.scheme }}

      - name: App icon and splash screen
        continue-on-error: true
        run: npx -y @capacitor/assets@3.0.5 generate --android

      - name: Sync web bundle into Android
        run: npx cap sync android

      - name: Version
        run: |
          code=$(( GITHUB_RUN_NUMBER + 100 ))
          name="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) name="1.0.${GITHUB_RUN_NUMBER}" ;; esac
          sed -i -E "s/versionCode [0-9]+/versionCode ${code}/; s/versionName \"[^\"]+\"/versionName \"${name}\"/" android/app/build.gradle

      - name: Build debug APK
        working-directory: ${{ matrix.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/${{ matrix.slug }}-debug.apk"

      - name: Build signed release APK (when signing secrets exist)
        working-directory: ${{ matrix.dir }}/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret — skipping the signed release APK (the debug APK is still built)."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out "$GITHUB_WORKSPACE/out/${{ matrix.slug }}-release.apk" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify --print-certs "$GITHUB_WORKSPACE/out/${{ matrix.slug }}-release.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Checksums
        working-directory: ${{ github.workspace }}/out
        run: sha256sum *.apk | tee ${{ matrix.slug }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}-apk
          path: out/*
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
