name: Android APKs

# Every push to main builds both APKs and publishes them as the newest
# GitHub Release, with fixed file names (s-taler.apk, talerbank.apk), so
#   https://github.com/<owner>/<repo>/releases/latest/download/s-taler.apk
# always serves the latest build. The websites link to exactly these URLs.
# Pushing a tag like v1.2.0 publishes a release under that version instead.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: S-Taler
            dir: apps/staler-web
            scheme: taler
            slug: s-taler
            api_var: STALER_API_URL
            default_api: https://s-taler.onrender.com

          - name: TalerBank
            dir: apps/bank-web
            scheme: talerbank
            slug: talerbank
            api_var: BANK_API_URL
            default_api: https://talerbank.onrender.com

    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      # Do not enable Gradle caching here.
      # The Android project is generated later by Capacitor.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Resolve API address
        env:
          API_URL: ${{ vars[matrix.api_var] }}
          DEFAULT_API: ${{ matrix.default_api }}
        run: |
          url="${API_URL:-$DEFAULT_API}"

          if [ -z "$API_URL" ]; then
            echo "::warning::Repository variable ${{ matrix.api_var }} is not set. Using $DEFAULT_API."
          fi

          case "$url" in
            https://*)
              ;;
            *)
              echo "::error::${{ matrix.api_var }} must start with https://"
              exit 1
              ;;
          esac

          echo "VITE_API_URL=${url%/}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run unit tests
        run: npm test

      - name: Build web bundle for Android
        run: npm run build:native

      - name: Create and harden Android project
        run: |
          npx cap add android
          node ../../scripts/android/prepare.mjs . ${{ matrix.scheme }}

      - name: Generate app icon and splash screen
        continue-on-error: true
        run: npx -y @capacitor/assets@3.0.5 generate --android

      - name: Sync web bundle into Android
        run: npx cap sync android

      - name: Set Android version
        run: |
          code=$(( GITHUB_RUN_NUMBER + 100 ))
          name="${GITHUB_REF_NAME#v}"

          case "$GITHUB_REF" in
            refs/tags/v*)
              ;;
            *)
              name="1.0.${GITHUB_RUN_NUMBER}"
              ;;
          esac

          sed -i -E \
            "s/versionCode [0-9]+/versionCode ${code}/; s/versionName \"[^\"]+\"/versionName \"${name}\"/" \
            android/app/build.gradle

      - name: Build debug APK
        working-directory: ${{ matrix.dir }}/android
        run: |
          chmod +x gradlew

          ./gradlew --no-daemon assembleDebug

          mkdir -p "$GITHUB_WORKSPACE/out"

          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/out/${{ matrix.slug }}-debug.apk"

      - name: Build signed release APK
        working-directory: ${{ matrix.dir }}/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::No Android keystore configured. Skipping signed release APK."
            exit 0
          fi

          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

          ./gradlew --no-daemon assembleRelease

          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

          "$bt/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/aligned.apk"

          "$bt/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASS \
            --out "$GITHUB_WORKSPACE/out/${{ matrix.slug }}-release.apk" \
            "$RUNNER_TEMP/aligned.apk"

          "$bt/apksigner" verify \
            --print-certs \
            "$GITHUB_WORKSPACE/out/${{ matrix.slug }}-release.apk"

          rm -f "$RUNNER_TEMP/release.jks"

      - name: Generate checksums
        working-directory: ${{ github.workspace }}/out
        run: |
          sha256sum *.apk | tee ${{ matrix.slug }}.sha256

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}-apk
          path: out/*
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push'
    needs: apk
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      # Stable names: prefer the signed release build, fall back to debug.
      - name: Prepare release files
        working-directory: out
        run: |
          for slug in s-taler talerbank; do
            if [ -f "$slug-release.apk" ]; then src="$slug-release.apk"; else src="$slug-debug.apk"; fi
            cp "$src" "$slug.apk"
          done
          rm -f *-release.apk *-debug.apk *.sha256
          sha256sum *.apk > SHA256SUMS.txt
          ls -la

      - name: Resolve version
        id: v
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag=v1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: S-Taler & TalerBank ${{ steps.v.outputs.tag }}
          make_latest: 'true'
          files: |
            out/s-taler.apk
            out/talerbank.apk
            out/SHA256SUMS.txt
          body: |
            Android builds of **S-Taler** (wallet) and **TalerBank** (bank) from commit ${{ github.sha }}.

            - `s-taler.apk` — S-Taler wallet
            - `talerbank.apk` — TalerBank

            Always-latest links:
            https://github.com/${{ github.repository }}/releases/latest/download/s-taler.apk
            https://github.com/${{ github.repository }}/releases/latest/download/talerbank.apk

      # Keep the Releases page tidy: only the 5 newest automatic builds stay.
      - name: Prune old automatic releases
        if: "!startsWith(github.ref, 'refs/tags/')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[] | select(.tag_name | test("^v1\\.0\\.[0-9]+$")) | .tag_name' \
            | sort -t. -k3 -n -r | tail -n +6 | while read -r tag; do
              echo "Deleting $tag"
              gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag || true
            done
